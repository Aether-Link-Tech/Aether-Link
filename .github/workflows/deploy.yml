# Builds the site and publishes it to GitHub Pages on every push to main.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Compile Tailwind CSS (replaces the CDN for faster pages)
        run: |
          curl -sSL -o tailwindcss https://github.com/tailwindlabs/tailwindcss/releases/download/v3.4.17/tailwindcss-linux-x64
          chmod +x tailwindcss
          printf '@tailwind base;\n@tailwind components;\n@tailwind utilities;\n' > /tmp/tw-input.css
          ./tailwindcss -c js/tailwind-config.js -i /tmp/tw-input.css -o css/tailwind.css --minify
          rm tailwindcss
          for f in *.html; do
            sed -i 's|<script src="https://cdn.tailwindcss.com"></script>|<link rel="stylesheet" href="css/tailwind.css">|; \|<script src="js/tailwind-config.js"></script>|d' "$f"
          done
          if grep -L 'css/tailwind.css' *.html | grep -q .; then echo "Some pages were not switched to compiled CSS"; exit 1; fi

      - name: Remove files that should not be published
        run: rm -rf .github README.md CLAUDE.md

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
